<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Video Post</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:12px 8px;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:3px 0 0;
  font-size:13px;
  color:#ccc;
}

.container{
  width:94%;
  max-width:700px;
  margin:10px auto;
}

.box{
  background:white;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

h2{
  font-size:17px;
  margin:0 0 8px;
}

input,
select,
button{
  width:100%;
  padding:9px;
  margin:4px 0;
  border-radius:7px;
  border:1px solid #ccc;
  font-size:14px;
}

button{
  background:#111;
  color:white;
  border:none;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.danger{
  background:#d93025;
}

.green{
  background:#168a3a;
}

.gray{
  background:#666;
}

.hidden{
  display:none;
}

.status{
  font-size:13px;
  padding:7px;
  border-radius:6px;
  background:#f1f1f1;
  margin-top:5px;
  word-break:break-word;
}

.folder-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.folder-btn{
  background:#eee;
  color:#222;
  border:1px solid #ddd;
  padding:8px 4px;
  font-size:13px;
}

.folder-btn.active{
  background:#111;
  color:white;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.video-card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  padding:7px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#000;
  border-radius:6px;
}

.video-title{
  font-size:14px;
  font-weight:bold;
  margin:6px 0;
  word-break:break-word;
}

.small{
  font-size:11px;
  color:#777;
  margin-bottom:5px;
}

.card-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.card-buttons button{
  font-size:12px;
  padding:7px 3px;
  margin:0;
}

@media(max-width:420px){
  .container{
    width:96%;
  }

  header h1{
    font-size:21px;
  }

  .video-card video{
    height:125px;
  }

  .folder-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .video-grid{
    gap:6px;
  }

  input,
  button{
    font-size:13px;
    padding:8px;
  }
}
</style></head><body><header>
  <h1>🎬 Video Post</h1>
  <p>ভিডিও শেয়ার করার সহজ জায়গা</p>
</header><div class="container">  <!-- LOGIN -->  <div id="loginBox" class="box"><h2>🔐 Admin Login</h2>

<input
  id="email"
  type="email"
  placeholder="Admin Email"
  autocomplete="username"
>

<input
  id="password"
  type="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button onclick="login()">
  🔐 Login
</button>

<div id="loginStatus" class="status">
  Admin account দিয়ে Login করুন
</div>

  </div>  <!-- ADMIN AREA -->  <div id="adminArea" class="hidden"><div class="box">

  <div style="font-size:13px;margin-bottom:7px;">
    👤 Admin Panel
  </div>

  <div id="userEmail" class="small"></div>

  <button class="gray" onclick="logout()">
    🚪 Logout
  </button>

</div>


<!-- FOLDERS -->
<div class="box">

  <h2>📁 Folders</h2>

  <button
    class="folder-btn active"
    id="homeFolderBtn"
    onclick="selectFolder(null)"
  >
    🏠 Home
  </button>

  <div id="folderList" class="folder-grid"></div>

  <input
    id="folderName"
    type="text"
    placeholder="নতুন Folder-এর নাম"
  >

  <button class="green" onclick="createFolder()">
    📁 Folder তৈরি
  </button>

  <button class="danger" onclick="deleteSelectedFolder()">
    🗑️ Selected Folder Delete
  </button>

  <div id="folderStatus" class="status"></div>

</div>


<!-- UPLOAD -->
<div class="box">

  <h2>📤 Video Post</h2>

  <div
    id="currentFolderText"
    class="status"
  >
    📁 Home
  </div>

  <input
    id="videoFile"
    type="file"
    accept="video/*"
  >

  <button
    class="green"
    onclick="uploadVideo()"
  >
    📤 Video Post করুন
  </button>

  <div id="uploadStatus" class="status"></div>

</div>


<!-- VIDEOS -->
<div class="box">

  <h2>🎬 Posted Videos</h2>

  <div id="videoList" class="video-grid"></div>

</div>

  </div></div><script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://sxyjlixnwayoouzccnuv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KAMMsvg-SY_8oFyk3b8Iqw_hAHx2Chr";

const ADMIN_ID =
  "e6fcce5e-66bd-4399-ab92-69c1e9617c02";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let selectedFolderId = null;


/* =========================
   PAGE START
========================= */

window.addEventListener("load", async () => {

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(session){

    currentUser = session.user;

    if(currentUser.id === ADMIN_ID){

      showAdmin();

    }else{

      await supabaseClient.auth.signOut();

      showLogin();

    }

  }else{

    showLogin();

  }

});


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("loginStatus");


  if(!email){

    status.textContent =
      "❌ Admin Email দিন";

    return;
  }

  if(!password){

    status.textContent =
      "❌ Password দিন";

    return;
  }


  status.textContent =
    "⏳ Login হচ্ছে...";


  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });


  if(error){

    status.textContent =
      "❌ Login হয়নি: " + error.message;

    return;
  }


  if(!data.user){

    status.textContent =
      "❌ User পাওয়া যায়নি";

    return;
  }


  if(data.user.id !== ADMIN_ID){

    await supabaseClient.auth.signOut();

    status.textContent =
      "❌ এই Login শুধু Admin-এর জন্য";

    return;
  }


  currentUser =
    data.user;

  showAdmin();

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminArea")
    .classList.remove("hidden");

  document
    .getElementById("userEmail")
    .textContent =
      "Logged in: " + currentUser.email;


  loadFolders();

  loadVideos();

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("adminArea")
    .classList.add("hidden");

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  showLogin();

}


/* =========================
   LOAD FOLDERS
========================= */

async function loadFolders(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("folders")
    .select("*")
    .order("created_at",{ascending:true});


  if(error){

    document
      .getElementById("folderStatus")
      .textContent =
      "❌ Folder load হয়নি: " +
      error.message;

    return;
  }


  const list =
    document.getElementById("folderList");

  list.innerHTML = "";


  data.forEach(folder => {

    const button =
      document.createElement("button");

    button.className =
      "folder-btn";

    button.textContent =
      "📁 " + folder.name;

    button.onclick = () =>
      selectFolder(folder.id, folder.name);

    list.appendChild(button);

  });

}


/* =========================
   SELECT FOLDER
========================= */

function selectFolder(id,name){

  selectedFolderId = id;


  document
    .getElementById("currentFolderText")
    .textContent =
      id
      ? "📁 " + name
      : "📁 Home";


  document
    .getElementById("homeFolderBtn")
    .classList.toggle(
      "active",
      id === null
    );


  loadVideos();

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder(){

  const input =
    document.getElementById("folderName");

  const name =
    input.value.trim();


  if(!name){

    document
      .getElementById("folderStatus")
      .textContent =
      "❌ Folder-এর নাম দিন";

    return;
  }


  const id =
    Date.now();


  const {
    error
  } =
  await supabaseClient
    .from("folders")
    .insert({
      id:id,
      name:name
    });


  if(error){

    document
      .getElementById("folderStatus")
      .textContent =
      "❌ Folder তৈরি হয়নি: " +
      error.message;

    return;
  }


  input.value = "";


  document
    .getElementById("folderStatus")
    .textContent =
    "✅ Folder তৈরি হয়েছে";


  loadFolders();

}


/* =========================
   DELETE FOLDER
========================= */

async function deleteSelectedFolder(){

  if(selectedFolderId === null){

    document
      .getElementById("folderStatus")
      .textContent =
      "❌ আগে একটি Folder select করুন";

    return;
  }


  const ok =
    confirm(
      "এই Folder delete করতে চান?"
    );

  if(!ok) return;


  const {
    error
  } =
  await supabaseClient
    .from("folders")
    .delete()
    .eq("id",selectedFolderId);


  if(error){

    document
      .getElementById("folderStatus")
      .textContent =
      "❌ Folder delete হয়নি: " +
      error.message;

    return;
  }


  selectedFolderId = null;


  document
    .getElementById("folderStatus")
    .textContent =
    "✅ Folder delete হয়েছে";


  document
    .getElementById("currentFolderText")
    .textContent =
    "📁 Home";


  loadFolders();

  loadVideos();

}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadVideo(){

  const input =
    document.getElementById("videoFile");

  const status =
    document.getElementById("uploadStatus");

  const file =
    input.files[0];


  if(!file){

    status.textContent =
      "❌ আগে একটি Video নির্বাচন করুন";

    return;
  }


  if(!file.type.startsWith("video/")){

    status.textContent =
      "❌ শুধু Video file দেওয়া যাবে";

    return;
  }


  status.textContent =
    "⏳ Video upload হচ্ছে...";


  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");


  const filePath =
    Date.now() +
    "_" +
    safeName;


  const {
    error:uploadError
  } =
  await supabaseClient
    .storage
    .from("videos")
    .upload(
      filePath,
      file,
      {
        contentType:
          file.type || "video/mp4",
        upsert:false
      }
    );


  if(uploadError){

    status.textContent =
      "❌ Video upload হয়নি: " +
      uploadError.message;

    return;
  }


  const {
    error:dbError
  } =
  await supabaseClient
    .from("videos")
    .insert({
      id:Date.now(),
      title:file.name,
      file_path:filePath,
      folder_id:selectedFolderId
    });


  if(dbError){

    await supabaseClient
      .storage
      .from("videos")
      .remove([filePath]);


    status.textContent =
      "❌ Video database-এ save হয়নি: " +
      dbError.message;

    return;
  }


  input.value = "";


  status.textContent =
    "✅ Video Post হয়েছে ❤️";


  loadVideos();

}


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

  const list =
    document.getElementById("videoList");


  list.innerHTML =
    "<div class='status'>⏳ Video load হচ্ছে...</div>";


  let query =
    supabaseClient
      .from("videos")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(selectedFolderId !== null){

    query =
      query.eq(
        "folder_id",
        selectedFolderId
      );

  }else{

    query =
      query.is(
        "folder_id",
        null
      );

  }


  const {
    data,
    error
  } = await query;


  if(error){

    list.innerHTML =
      "<div class='status'>❌ Video load হয়নি: "
      + escapeHtml(error.message)
      + "</div>";

    return;
  }


  if(!data || data.length === 0){

    list.innerHTML =
      "<div class='status'>📭 এই Folder-এ কোনো Video নেই</div>";

    return;
  }


  list.innerHTML = "";


  for(const video of data){

    const card =
      document.createElement("div");

    card.className =
      "video-card";


    const {
      data:signedData,
      error:signedError
    } =
    await supabaseClient
      .storage
      .from("videos")
      .createSignedUrl(
        video.file_path,
        3600
      );


    if(signedError || !signedData){

      card.innerHTML = `

        <div class="video-title">
          ${escapeHtml(video.title || "Video")}
        </div>

        <div class="status">
          ❌ Video দেখা যাচ্ছে না
        </div>

        <div class="small">
          ${escapeHtml(
            signedError
              ? signedError.message
              : "Signed URL পাওয়া যায়নি"
          )}
        </div>

        <button
          class="danger"
          onclick="deleteVideo(${video.id},'${escapeJs(video.file_path)}')"
        >
          🗑️ Delete
        </button>

      `;

      list.appendChild(card);

      continue;
    }


    const url =
      signedData.signedUrl;


    card.innerHTML = `

      <video
        controls
        preload="metadata"
        playsinline
        src="${escapeHtml(url)}"
      ></video>

      <div class="video-title">
        ${escapeHtml(video.title || "Video")}
      </div>

      <div class="small">
        📁 ${selectedFolderId === null ? "Home" : "Folder"}
      </div>

      <div class="card-buttons">

        <button
          class="green"
          onclick="openVideo('${escapeJs(url)}')"
        >
          ▶️ Open
        </button>

        <button
          onclick="downloadVideo('${escapeJs(url)}')"
        >
          ⬇️ Download
        </button>

        <button
          class="danger"
          style="grid-column:1/3"
          onclick="deleteVideo(${video.id},'${escapeJs(video.file_path)}')"
        >
          🗑️ Delete
        </button>

      </div>

    `;


    list.appendChild(card);

  }

}


/* =========================
   OPEN VIDEO
========================= */

function openVideo(url){

  window.open(
    url,
    "_blank"
  );

}


/* =========================
   DOWNLOAD
========================= */

function downloadVideo(url){

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "video.mp4";

  link.target =
    "_blank";

  document.body.appendChild(link);

  link.click();

  link.remove();

}


/* =========================
   DELETE VIDEO
========================= */

async function deleteVideo(
  id,
  filePath
){

  const ok =
    confirm(
      "এই Video delete করতে চান?"
    );

  if(!ok) return;


  const {
    error:storageError
  } =
  await supabaseClient
    .storage
    .from("videos")
    .remove([
      filePath
    ]);


  if(storageError){

    alert(
      "❌ Storage থেকে Video delete হয়নি: "
      + storageError.message
    );

    return;
  }


  const {
    error:dbError
  } =
  await supabaseClient
    .from("videos")
    .delete()
    .eq("id",id);


  if(dbError){

    alert(
      "❌ Database থেকে Video delete হয়নি: "
      + dbError.message
    );

    return;
  }


  alert(
    "✅ Video delete হয়েছে"
  );


  loadVideos();

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}

</script></body>
</html>
