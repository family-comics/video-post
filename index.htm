<!DOCTYPE html><html lang="bn">

<title>Video Post</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
  box-sizing:border-box;
}

body{

}

header{

header h1{

h2{

input,
select,
button{

button{

.danger{

}

}

.blue{

}

.hidden{

}

  padding:7px 4px;
}

.folder-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.folder-item{
  min-width:0;
}

.folder-btn{
  background:#eee;
  color:#222;
  border:1px solid #ddd;
  padding:7px 3px;
  font-size:11px;
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.folder-btn.active{
  background:#111;
  color:white;
}

.folder-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
}

.folder-actions button{
  font-size:10px;
  padding:5px 2px;
  margin:0;
}

.folder-create{
  display:grid;
  grid-template-columns:1fr 90px;
  gap:4px;
  margin-top:5px;
}

.folder-create input{
  margin:0;
}

.folder-create button{
  margin:0;
}

/* VIDEO */
.video-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.video-card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:7px;
  padding:5px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  height:125px;
  object-fit:cover;
  background:#000;
  border-radius:5px;
}

.video-title{
  font-size:12px;
  font-weight:bold;
  margin:4px 0;
  word-break:break-word;
}

.small{
  font-size:10px;
  color:#777;
  margin-bottom:3px;
}

.card-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
}

.card-buttons button{
  font-size:10px;
  padding:6px 2px;
  margin:0;
}

/* LOGIN */
#loginBox{
  max-width:300px;
  margin:10px auto;
}

#loginBox input,
#loginBox button{
  padding:7px;
  font-size:12px;
}

/* MOBILE */
@media(max-width:420px){

  .container{
    width:97%;
  }

  header h1{
    font-size:19px;
  }

  header p{
    font-size:10px;
  }

  .box{
    padding:6px;
    margin-bottom:6px;
  }

  h2{
    font-size:14px;
  }

  input,
  select,
  button{
    padding:7px 5px;
    font-size:11px;
  }

  .folder-grid{
    gap:4px;
  }

  .folder-btn{
    font-size:10px;
    padding:6px 2px;
  }

  .video-grid{
    gap:5px;
  }

  .video-card{
    padding:4px;
  }

  .video-card video{

  }

  .video-title{
    font-size:11px;
  }

  .card-buttons button{
    font-size:9px;
    padding:5px 2px;
  }
}
</style></head><body><header>
  <h1>🎬 Video Post</h1>
  <p>ভিডিও শেয়ার করার সহজ জায়গা</p>
</header><div class="container">  <!-- LOGIN -->  <div id="loginBox" class="box"><h2>🔐 Admin Login</h2>

<input
  id="email"

  autocomplete="username"
>

<input
  id="password"
  type="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button onclick="login()">
  🔐 Login
</button>

<div id="loginStatus" class="status">
  Admin account দিয়ে Login করুন
</div>

  </div>  <!-- ADMIN AREA -->  <div id="adminArea" class="hidden"><!-- TOP NAV -->
<div class="top-actions">

  <button
    class="blue"
    onclick="goBack()"
  >
    ⬅️ Back
  </button>

  <button
    class="gray"
    onclick="goHome()"
  >
    🏠 Home
  </button>

</div>


<!-- ADMIN -->
<div class="box">

  <h2>👤 Admin Panel</h2>

  <button
    class="gray"
    onclick="logout()"
  >
    🚪 Logout

</div>


<!-- FOLDERS -->
<div class="box">

  <h2>📁 Folders</h2>

  <button

  <div
    id="folderList"

  <div class="folder-create">

    <input
      id="folderName"
      type="text"
      placeholder="Folder নাম"
    >

    <button

      📁 তৈরি
    </button>

  </div>


  <div id="folderStatus" class="status"></div>

</div>


<!-- UPLOAD -->
<div class="box">

  <h2>📤 Video Post</h2>

  <div
    id="currentFolderText"
    class="status"
  >
    📁 Home
  </div>

    id="videoFile"
    type="file"
    accept="video/*"
  >

  <button
    class="green"

    📤 Video Post করুন
  </button>

  <div id="uploadStatus" class="status"></div>

</div>

<div class="box">

  <h2>🎬 Posted Videos</h2>

  <div
    id="videoList"
    class="video-grid"
  ></div>

</div>

  </div></div><script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://sxyjlixnwayoouzccnuv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KAMMsvg-SY_8oFyk3b8Iqw_hAHx2Chr";

const ADMIN_ID =
  "e6fcce5e-66bd-4399-ab92-69c1e9617c02";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let selectedFolderId = null;
let selectedFolderName = "Home";
let folderHistory = [];


/* =========================
   PAGE START
========================= */

window.addEventListener(
  "load",
  async () => {

    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(session){

      currentUser =
        session.user;


      if(currentUser.id === ADMIN_ID){

        showAdmin();

      }else{

        await supabaseClient.auth.signOut();

        showLogin();

      }

    }else{

      showLogin();

    }

  }
);


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const status =
    document
      .getElementById("loginStatus");


  if(!email){

    status.textContent =
      "❌ Admin Email দিন";

    return;
  }


  if(!password){

    status.textContent =
      "❌ Password দিন";

    return;
  }


  status.textContent =
    "⏳ Login হচ্ছে...";


  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({

    email:email,
    password:password

  });


  if(error){

    status.textContent =
      "❌ Login হয়নি: " +
      error.message;

    return;
  }


  if(!data.user){

    status.textContent =
      "❌ User পাওয়া যায়নি";

    return;
  }


  if(data.user.id !== ADMIN_ID){

    await supabaseClient.auth.signOut();

    status.textContent =
      "❌ এই Login শুধু Admin-এর জন্য";

    return;
  }


  currentUser =
    data.user;

  showAdmin();

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");


  document
    .getElementById("adminArea")
    .classList.remove("hidden");


  selectedFolderId = null;
  selectedFolderName = "Home";
  folderHistory = [];


  updateFolderText();

  loadFolders();

  loadVideos();

}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList
    .remove("hidden");


  document
    .getElementById("adminArea")
    .classList
    .add("hidden");

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  showLogin();

}


/* =========================
   FOLDER LOAD
========================= */

async function loadFolders(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("folders")
    .select("*")
    .order(
      "created_at",
      {ascending:true}
    );


  if(error){

    document
      .getElementById("folderStatus")
      .textContent =
      "❌ Folder load হয়নি: " +
      error.message;

    return;
  }


  const list =
    document
      .getElementById("folderList");


  list.innerHTML = "";


  data.forEach(
    folder => {

      const item =
        document.createElement("div");

      item.className =
        "folder-item";


      const selectButton =
        document.createElement("button");

      selectButton.className =
        "folder-btn";


      if(
        selectedFolderId === folder.id
      ){

        selectButton.classList.add(
          "active"
        );

      }


      selectButton.textContent =
        "📁 " + folder.name;


      selectButton.title =
        folder.name;


      selectButton.onclick =
        () => {

          selectFolder(
            folder.id,
            folder.name
          );

        };


      const actions =
        document.createElement("div");

      actions.className =
        "folder-actions";


      const renameButton =
        document.createElement("button");

      renameButton.className =
        "blue";

      renameButton.textContent =
        "✏️";

      renameButton.title =
        "Rename";

      renameButton.onclick =
        () => {

          renameFolder(
            folder.id,
            folder.name
          );

        };


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "danger";

      deleteButton.textContent =
        "🗑️";

      deleteButton.title =
        "Delete";

      deleteButton.onclick =
        () => {

          deleteFolder(
            folder.id,
            folder.name
          );

        };


      actions.appendChild(
        renameButton
      );

      actions.appendChild(
        deleteButton
      );


      item.appendChild(
        selectButton
      );

      item.appendChild(
        actions
      );


      list.appendChild(
        item
      );

    }
  );

}


/* =========================
   SELECT FOLDER
========================= */

function selectFolder(
  id,
  name
){

  if(
    selectedFolderId !== id
  ){

    folderHistory.push({
      id:selectedFolderId,
      name:selectedFolderName
    });

  }


  selectedFolderId = id;

  selectedFolderName =
    name || "Home";


  updateFolderText();

  loadFolders();

  loadVideos();

}


/* =========================
   UPDATE FOLDER TEXT
========================= */

function updateFolderText(){

  document
    .getElementById(
      "currentFolderText"
    )
    .textContent =
      "📁 " +
      selectedFolderName;


  document
    .getElementById(
      "homeFolderBtn"
    )
    .classList.toggle(
      "active",
      selectedFolderId === null
    );

}


/* =========================
   BACK BUTTON
========================= */

function goBack(){

  if(folderHistory.length > 0){

    const previous =
      folderHistory.pop();


    selectedFolderId =
      previous.id;

    selectedFolderName =
      previous.name;


  }else{

    selectedFolderId =
      null;

    selectedFolderName =
      "Home";

  }


  updateFolderText();

  loadFolders();

  loadVideos();

}


/* =========================
   HOME
========================= */

function goHome(){

  selectedFolderId = null;

  selectedFolderName =
    "Home";

  folderHistory = [];

  updateFolderText();

  loadFolders();

  loadVideos();

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder(){

  const input =
    document
      .getElementById(
        "folderName"
      );


  const name =
    input.value.trim();


  if(!name){

    document
      .getElementById(
        "folderStatus"
      )
      .textContent =
      "❌ Folder-এর নাম দিন";

    return;
  }


  const id =
    Date.now();


  const {
    error
  } =
  await supabaseClient
    .from("folders")
    .insert({

      id:id,
      name:name

    });


  if(error){

    document
      .getElementById(
        "folderStatus"
      )
      .textContent =
      "❌ Folder তৈরি হয়নি: " +
      error.message;

    return;
  }


  input.value = "";


  document
    .getElementById(
      "folderStatus"
    )
    .textContent =
    "✅ Folder তৈরি হয়েছে";


  loadFolders();

}


/* =========================
   RENAME FOLDER
========================= */

async function renameFolder(
  id,
  oldName
){

  const newName =
    prompt(
      "নতুন Folder নাম দিন:",
      oldName
    );


  if(
    newName === null
  ){

    return;

  }


  const name =
    newName.trim();


  if(!name){

    alert(
      "❌ Folder-এর নাম খালি রাখা যাবে না"
    );

    return;
  }


  if(name === oldName){

    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("folders")
    .update({
      name:name
    })
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "❌ Folder Rename হয়নি: " +
      error.message
    );

    return;
  }


  if(
    selectedFolderId === id
  ){

    selectedFolderName =
      name;

    updateFolderText();

  }


  document
    .getElementById(
      "folderStatus"
    )
    .textContent =
    "✅ Folder Rename হয়েছে";


  loadFolders();

}


/* =========================
   DELETE FOLDER
========================= */

async function deleteFolder(
  id,
  name
){

  const ok =
    confirm(
      "📁 " +
      name +
      "\n\nএই Folder delete করতে চান?"
    );


  if(!ok){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("folders")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    document
      .getElementById(
        "folderStatus"
      )
      .textContent =
      "❌ Folder delete হয়নি: " +
      error.message;

    return;
  }


  if(
    selectedFolderId === id
  ){

    selectedFolderId =
      null;

    selectedFolderName =
      "Home";

    folderHistory = [];

    updateFolderText();

  }


  document
    .getElementById(
      "folderStatus"
    )
    .textContent =
    "✅ Folder delete হয়েছে";


  loadFolders();

  loadVideos();

}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadVideo(){

  const input =
    document
      .getElementById(
        "videoFile"
      );


  const status =
    document
      .getElementById(
        "uploadStatus"
      );


  const file =
    input.files[0];


  if(!file){

    status.textContent =
      "❌ আগে একটি Video নির্বাচন করুন";

    return;
  }


  if(
    !file.type.startsWith(
      "video/"
    )
  ){

    status.textContent =
      "❌ শুধু Video file দেওয়া যাবে";

    return;
  }


  status.textContent =
    "⏳ Video upload হচ্ছে...";


  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );


  const filePath =
    Date.now() +
    "_" +
    safeName;


  const {
    error:uploadError
  } =
  await supabaseClient
    .storage
    .from("videos")
    .upload(
      filePath,
      file,
      {
        contentType:
          file.type ||
          "video/mp4",

        upsert:false
      }
    );


  if(uploadError){

    status.textContent =
      "❌ Video upload হয়নি: " +
      uploadError.message;

    return;
  }


  const {
    error:dbError
  } =
  await supabaseClient
    .from("videos")
    .insert({

      id:Date.now(),

      title:file.name,

      file_path:filePath,

      folder_id:
        selectedFolderId

    });


  if(dbError){

    await supabaseClient
      .storage
      .from("videos")
      .remove([
        filePath
      ]);


    status.textContent =
      "❌ Database-এ save হয়নি: " +
      dbError.message;

    return;
  }


  input.value = "";


  status.textContent =
    "✅ Video Post হয়েছে ❤️";


  loadVideos();

}


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

  const list =
    document
      .getElementById(
        "videoList"
      );


  list.innerHTML =
    "<div class='status'>⏳ Video load হচ্ছে...</div>";


  let query =
    supabaseClient
      .from("videos")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(
    selectedFolderId !== null
  ){

    query =
      query.eq(
        "folder_id",
        selectedFolderId
      );

  }else{

    query =
      query.is(
        "folder_id",
        null
      );

  }


  const {
    data,
    error
  } =
  await query;


  if(error){

    list.innerHTML =
      "<div class='status'>❌ Video load হয়নি: " +
      escapeHtml(
        error.message
      ) +
      "</div>";

    return;
  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      "<div class='status'>📭 এই Folder-এ কোনো Video নেই</div>";

    return;
  }


  list.innerHTML = "";


  for(
    const video of data
  ){

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "video-card";


    const {
      data:signedData,
      error:signedError
    } =
    await supabaseClient
      .storage
      .from("videos")
      .createSignedUrl(
        video.file_path,
        3600
      );


    if(
      signedError ||
      !signedData
    ){

      card.innerHTML = `

        <div class="video-title">
          ${escapeHtml(
            video.title ||
            "Video"
          )}
        </div>

        <div class="status">
          ❌ Video দেখা যাচ্ছে না
        </div>

        <div class="small">
          ${escapeHtml(
            signedError
              ? signedError.message
              : "Signed URL পাওয়া যায়নি"
          )}
        </div>

        <button
          class="danger"
          onclick="deleteVideo(
            ${video.id},
            '${escapeJs(
              video.file_path
            )}'
          )"
        >
          🗑️ Delete
        </button>

      `;


      list.appendChild(
        card
      );


      continue;

    }


    const url =
      signedData.signedUrl;


    card.innerHTML = `

      <video
        controls
        preload="metadata"
        playsinline
        src="${escapeHtml(url)}"
      ></video>

      <div class="video-title">
        ${escapeHtml(
          video.title ||
          "Video"
        )}
      </div>

      <div class="small">
        📁 ${escapeHtml(
          selectedFolderName
        )}
      </div>

      <div class="card-buttons">

        <button
          class="green"
          onclick="openVideo(
            '${escapeJs(url)}'
          )"
        >
          ▶️ Open
        </button>

        <button
          onclick="downloadVideo(
            '${escapeJs(url)}'
          )"
        >
          ⬇️ Download
        </button>

        <button
          class="danger"
          style="grid-column:1/3"
          onclick="deleteVideo(
            ${video.id},
            '${escapeJs(
              video.file_path
            )}'
          )"
        >
          🗑️ Delete
        </button>

      </div>

    `;


    list.appendChild(
      card
    );

  }

}


/* =========================
   OPEN VIDEO
========================= */

function openVideo(url){

  window.open(
    url,
    "_blank"
  );

}


/* =========================
   DOWNLOAD
========================= */

function downloadVideo(url){

  const link =
    document.createElement(
      "a"
    );


  link.href = url;

  link.download =
    "video.mp4";

  link.target =
    "_blank";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();

}


/* =========================
   DELETE VIDEO
========================= */

async function deleteVideo(
  id,
  filePath
){

  const ok =
    confirm(
      "এই Video delete করতে চান?"
    );


  if(!ok){

    return;

  }


  const {
    error:storageError
  } =
  await supabaseClient
    .storage
    .from("videos")
    .remove([
      filePath
    ]);


  if(storageError){

    alert(
      "❌ Storage থেকে Video delete হয়নি: " +
      storageError.message
    );

    return;
  }


  const {
    error:dbError
  } =
  await supabaseClient
    .from("videos")
    .delete()
    .eq(
      "id",
      id
    );


  if(dbError){

    alert(
      "❌ Database থেকে Video delete হয়নি: " +
      dbError.message
    );

    return;
  }


  alert(
    "✅ Video delete হয়েছে"
  );


  loadVideos();

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeJs(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}
