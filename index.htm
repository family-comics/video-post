<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Video Post</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
}

header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:12px 8px;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:3px 0 0;
  font-size:12px;
  color:#ccc;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:7px;
}

.box{
  background:#fff;
  border-radius:9px;
  padding:9px;
  margin-bottom:8px;
  box-shadow:0 1px 4px #ddd;
}

h2{
  font-size:15px;
  margin:0 0 7px;
}

input,
select{
  width:100%;
  padding:8px;
  margin:3px 0;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:13px;
  background:#fff;
}

button{
  width:auto;
  padding:7px 10px;
  margin:3px 2px 3px 0;
  border:0;
  border-radius:6px;
  background:#111;
  color:#fff;
  font-size:12px;
  cursor:pointer;
}

button:disabled{
  background:#999;
}

.hidden{
  display:none!important;
}

.logout,
.delete{
  background:#d00000;
}

.download{
  background:#087f23;
}

.message{
  text-align:center;
  font-size:12px;
  padding:4px;
  word-break:break-word;
}

/* LOGIN */
#loginBox{
  max-width:330px;
  margin:15px auto;
}

#loginBox button{
  width:100%;
  margin-top:5px;
}

/* FOLDER */
.folder-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-bottom:6px;
}

.folder{
  background:#eee;
  padding:7px 3px;
  border-radius:7px;
  text-align:center;
  font-size:11px;
  cursor:pointer;
  word-break:break-word;
}

.folder.active{
  background:#111;
  color:#fff;
}

.folder-row{
  display:flex;
  gap:5px;
}

.folder-row input{
  flex:1;
  min-width:0;
}

.folder-row button{
  flex-shrink:0;
}

/* VIDEO POST */
.file-input{
  width:100%;
  padding:6px;
  font-size:12px;
  background:#fafafa;
}

.file-name{
  font-size:11px;
  color:#555;
  margin:3px 0;
  word-break:break-word;
}

/* VIDEO */
.video-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.video-card{
  background:#fafafa;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:hidden;
}

.video-card video{
  width:100%;
  height:145px;
  display:block;
  background:#000;
}

.video-info{
  padding:6px;
}

.video-title{
  font-size:12px;
  font-weight:bold;
  margin-bottom:3px;
  word-break:break-word;
}

.video-folder{
  font-size:10px;
  color:#777;
  margin-bottom:3px;
}

.small-btn{
  font-size:10px;
  padding:6px 8px;
}

.error-text{
  color:#d00000;
  font-size:10px;
  line-height:1.4;
  word-break:break-word;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:18px 5px;
  color:#777;
  font-size:12px;
}

@media(max-width:420px){

  header h1{
    font-size:20px;
  }

  .container{
    padding:5px;
  }

  .box{
    padding:8px;
  }

  .video-list{
    gap:5px;
  }

  .video-card video{
    height:120px;
  }

  .folder-list{
    gap:4px;
  }

  .folder{
    font-size:10px;
    padding:7px 2px;
  }

  button{
    padding:6px 9px;
    font-size:11px;
  }
}
</style></head><body><header>
  <h1>🎬 Video Post</h1>
  <p>ভিডিও শেয়ার করার সহজ জায়গা</p>
</header><div class="container"><!-- ================= LOGIN ================= --><div id="loginBox" class="box">  <h2>🔐 Admin Login</h2><input
id="email"
type="email"
placeholder="Admin Email"
autocomplete="username"

«»

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"

«»

  <button onclick="login()">
    🔐 Login
  </button>  <div id="loginMessage" class="message"></div></div><!-- ================= ADMIN ================= --><div id="adminArea" class="hidden">  <!-- ADMIN -->  <div class="box"><h2>👤 Admin Panel</h2>

<div
  id="adminEmail"
  style="font-size:11px;color:#777;margin-bottom:3px">
</div>

<button
  class="logout"
  onclick="logout()">
  🚪 Logout
</button>

  </div>  <!-- FOLDERS -->  <div class="box"><h2>📁 Folders</h2>

<div
  id="folderList"
  class="folder-list">
</div>

<div class="folder-row">

  <input
    id="folderName"
    type="text"
    placeholder="নতুন Folder-এর নাম"
  >

  <button onclick="createFolder()">
    📁 তৈরি
  </button>

</div>

<button
  class="delete"
  onclick="deleteSelectedFolder()">
  🗑️ Delete
</button>

<div
  id="folderMessage"
  class="message">
</div>

  </div>  <!-- VIDEO POST -->  <div class="box"><h2>📤 Video Post</h2>

<select id="videoFolder">
  <option value="">📁 Home</option>
</select>

<input
  id="videoFile"
  class="file-input"
  type="file"
  accept="video/*"
  onchange="showFileName()"
>

<div
  id="selectedFileName"
  class="file-name">
</div>

<button
  id="uploadBtn"
  onclick="uploadVideo()">
  📤 Post করুন
</button>

<div
  id="uploadMessage"
  class="message">
</div>

  </div>  <!-- POSTED VIDEOS -->  <div class="box"><h2>🎬 Posted Videos</h2>

<div
  id="videoList"
  class="video-list">
</div>

  </div></div></div><script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sxyjlixnwayoouzccnuv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KAMMsvg-SY_8oFyk3b8Iqw_hAHx2Chr";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ADMIN ID
========================= */

const ADMIN_ID =
"e6fcce5e-66bd-4399-ab92-69c1e9617c02";


let selectedFolderId = null;
let folders = [];


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const msg =
    document.getElementById("loginMessage");


  if(!email){

    msg.innerText =
      "⚠️ Admin Email দিন";

    return;
  }


  if(!password){

    msg.innerText =
      "⚠️ Password দিন";

    return;
  }


  msg.innerText =
    "⏳ Login হচ্ছে...";


  const result =
    await supabaseClient.auth
      .signInWithPassword({
        email:email,
        password:password
      });


  if(result.error){

    msg.innerText =
      "❌ Login হয়নি: " +
      result.error.message;

    return;
  }


  const user =
    result.data.user;


  if(!user){

    msg.innerText =
      "❌ User পাওয়া যায়নি";

    return;
  }


  if(user.id !== ADMIN_ID){

    await supabaseClient.auth.signOut();

    msg.innerText =
      "❌ এই Account Admin নয়";

    return;
  }


  msg.innerText = "";

  await showAdmin(user);
}


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin(user){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminArea")
    .classList.remove("hidden");


  document
    .getElementById("adminEmail")
    .innerText =
      "Logged in: " +
      user.email;


  await loadFolders();

  await loadVideos();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();
}


/* =========================
   SESSION
========================= */

async function checkSession(){

  const result =
    await supabaseClient.auth
      .getSession();


  const session =
    result.data.session;


  if(!session){
    return;
  }


  if(session.user.id !== ADMIN_ID){

    await supabaseClient.auth.signOut();

    return;
  }


  await showAdmin(session.user);
}


/* =========================
   LOAD FOLDERS
========================= */

async function loadFolders(){

  const result =
    await supabaseClient
      .from("folders")
      .select("*")
      .order(
        "created_at",
        {ascending:true}
      );


  if(result.error){

    console.log(
      "FOLDER ERROR:",
      result.error
    );

    return;
  }


  folders =
    result.data || [];


  renderFolders();

  renderFolderSelect();
}


/* =========================
   RENDER FOLDERS
========================= */

function renderFolders(){

  const box =
    document.getElementById(
      "folderList"
    );


  box.innerHTML = "";


  const home =
    document.createElement("div");


  home.className =
    "folder" +
    (
      selectedFolderId === null
        ? " active"
        : ""
    );


  home.textContent =
    "🏠 Home";


  home.onclick =
    async function(){

      selectedFolderId = null;

      renderFolders();

      await loadVideos();
    };


  box.appendChild(home);


  folders.forEach(folder => {

    const div =
      document.createElement("div");


    div.className =
      "folder" +
      (
        selectedFolderId === folder.id
          ? " active"
          : ""
      );


    div.textContent =
      "📁 " +
      folder.name;


    div.onclick =
      async function(){

        selectedFolderId =
          folder.id;

        renderFolders();

        await loadVideos();
      };


    box.appendChild(div);

  });

}


/* =========================
   FOLDER SELECT
========================= */

function renderFolderSelect(){

  const select =
    document.getElementById(
      "videoFolder"
    );


  select.innerHTML =
    '<option value="">📁 Home</option>';


  folders.forEach(folder => {

    const option =
      document.createElement("option");


    option.value =
      folder.id;


    option.textContent =
      "📁 " +
      folder.name;


    select.appendChild(option);

  });

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder(){

  const input =
    document.getElementById(
      "folderName"
    );

  const msg =
    document.getElementById(
      "folderMessage"
    );


  const name =
    input.value.trim();


  if(!name){

    msg.innerText =
      "⚠️ Folder-এর নাম দিন";

    return;
  }


  msg.innerText =
    "⏳ Folder তৈরি হচ্ছে...";


  const result =
    await supabaseClient
      .from("folders")
      .insert({
        id:Date.now(),
        name:name
      });


  if(result.error){

    msg.innerText =
      "❌ Folder তৈরি হয়নি: " +
      result.error.message;

    return;
  }


  input.value = "";

  msg.innerText =
    "✅ Folder তৈরি হয়েছে";


  await loadFolders();
}


/* =========================
   DELETE FOLDER
========================= */

async function deleteSelectedFolder(){

  const msg =
    document.getElementById(
      "folderMessage"
    );


  if(selectedFolderId === null){

    msg.innerText =
      "⚠️ আগে একটি Folder নির্বাচন করুন";

    return;
  }


  const folder =
    folders.find(
      f => f.id === selectedFolderId
    );


  if(!folder){
    return;
  }


  if(!confirm(
    '"' +
    folder.name +
    '" Folder delete করবেন?'
  )){
    return;
  }


  msg.innerText =
    "⏳ Folder delete হচ্ছে...";


  const result =
    await supabaseClient
      .from("folders")
      .delete()
      .eq(
        "id",
        selectedFolderId
      );


  if(result.error){

    msg.innerText =
      "❌ Folder delete হয়নি: " +
      result.error.message;

    return;
  }


  selectedFolderId = null;

  msg.innerText =
    "✅ Folder delete হয়েছে";


  await loadFolders();

  await loadVideos();
}


/* =========================
   FILE NAME
========================= */

function showFileName(){

  const input =
    document.getElementById(
      "videoFile"
    );

  const box =
    document.getElementById(
      "selectedFileName"
    );


  if(!input.files.length){

    box.innerText = "";

    return;
  }


  box.innerText =
    "🎬 " +
    input.files[0].name;
}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadVideo(){

  const fileInput =
    document.getElementById(
      "videoFile"
    );

  const folderValue =
    document.getElementById(
      "videoFolder"
    ).value;

  const msg =
    document.getElementById(
      "uploadMessage"
    );

  const btn =
    document.getElementById(
      "uploadBtn"
    );


  if(!fileInput.files.length){

    msg.innerText =
      "⚠️ একটি Video নির্বাচন করুন";

    return;
  }


  const file =
    fileInput.files[0];


  if(!file.type.startsWith("video/")){

    msg.innerText =
      "❌ শুধু Video file দেওয়া যাবে";

    return;
  }


  btn.disabled = true;

  msg.innerText =
    "⏳ Video Upload হচ্ছে...";


  const originalName =
    file.name;


  const extension =
    originalName.includes(".")
      ? originalName
          .split(".")
          .pop()
          .toLowerCase()
      : "mp4";


  const baseName =
    originalName
      .replace(/\.[^/.]+$/,"")
      .trim();


  const safeName =
    baseName
      .replace(/[^\p{L}\p{N}\-_ ]/gu,"")
      .replace(/\s+/g,"_")
      .substring(0,80)
      || "video";


  const filePath =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8) +
    "_" +
    safeName +
    "." +
    extension;


  const uploadResult =
    await supabaseClient
      .storage
      .from("videos")
      .upload(
        filePath,
        file,
        {
          contentType:
            file.type || "video/mp4",

          cacheControl:"3600",

          upsert:false
        }
      );


  if(uploadResult.error){

    btn.disabled = false;

    msg.innerText =
      "❌ Upload হয়নি: " +
      uploadResult.error.message;

    return;
  }


  const insertData = {

    id:Date.now(),

    title:
      baseName || "Video",

    file_path:
      filePath
  };


  if(folderValue){

    insertData.folder_id =
      Number(folderValue);
  }


  const dbResult =
    await supabaseClient
      .from("videos")
      .insert(
        insertData
      );


  if(dbResult.error){

    await supabaseClient
      .storage
      .from("videos")
      .remove([
        filePath
      ]);


    btn.disabled = false;

    msg.innerText =
      "❌ Video তথ্য save হয়নি: " +
      dbResult.error.message;

    return;
  }


  fileInput.value = "";

  document
    .getElementById(
      "selectedFileName"
    )
    .innerText = "";


  btn.disabled = false;

  msg.innerText =
    "✅ Video Post হয়েছে ❤️";


  await loadVideos();
}


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

  const box =
    document.getElementById(
      "videoList"
    );


  box.innerHTML =
    '<div class="empty">⏳ Video লোড হচ্ছে...</div>';


  let query =
    supabaseClient
      .from("videos")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(selectedFolderId !== null){

    query =
      query.eq(
        "folder_id",
        selectedFolderId
      );
  }


  const result =
    await query;


  if(result.error){

    box.innerHTML =
      '<div class="empty">❌ Video লোড হয়নি<br>' +
      escapeHtml(
        result.error.message
      ) +
      '</div>';

    return;
  }


  const data =
    result.data || [];


  if(data.length === 0){

    box.innerHTML =
      '<div class="empty">🎬 এই Folder-এ কোনো Video নেই</div>';

    return;
  }


  box.innerHTML = "";


  for(const video of data){

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "video-card";


    const folder =
      folders.find(
        f => f.id === video.folder_id
      );


    const folderName =
      folder
        ? folder.name
        : "Home";


    const signedResult =
      await supabaseClient
        .storage
        .from("videos")
        .createSignedUrl(
          video.file_path,
          3600
        );


    if(
      signedResult.error ||
      !signedResult.data ||
      !signedResult.data.signedUrl
    ){

      const errorMessage =
        signedResult.error
          ? signedResult.error.message
          : "Signed URL তৈরি হয়নি";


      card.innerHTML = `
        <div class="video-info">

          <div class="video-title">
            ${escapeHtml(video.title)}
          </div>

          <div class="video-folder">
            📁 ${escapeHtml(folderName)}
          </div>

          <div class="error-text">
            ❌ Video দেখা যাচ্ছে না<br>
            ${escapeHtml(errorMessage)}
          </div>

        </div>
      `;


      box.appendChild(card);

      continue;
    }


    const url =
      signedResult.data.signedUrl;


    card.innerHTML = `

      <video
        controls
        preload="metadata"
        playsinline>
        <source
          src="${escapeHtml(url)}"
          type="video/${escapeHtml(
            getVideoExtension(video.file_path)
          )}">
      </video>

      <div class="video-info">

        <div class="video-title">
          ${escapeHtml(video.title)}
        </div>

        <div class="video-folder">
          📁 ${escapeHtml(folderName)}
        </div>

        <button
          class="small-btn download"
          onclick="downloadVideo('${escapeJs(url)}')">
          ⬇️ Download
        </button>

        <button
          class="small-btn delete"
          onclick="deleteVideo(
            ${video.id},
            '${escapeJs(video.file_path)}'
          )">
          🗑️ Delete
        </button>

      </div>
    `;


    box.appendChild(card);

  }
}


/* =========================
   VIDEO EXTENSION
========================= */

function getVideoExtension(path){

  const name =
    String(path || "");


  if(!name.includes(".")){
    return "mp4";
  }


  return name
    .split(".")
    .pop()
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"")
    || "mp4";
}


/* =========================
   DOWNLOAD
========================= */

function downloadVideo(url){

  const a =
    document.createElement("a");


  a.href = url;

  a.target = "_blank";

  a.download = "";


  document.body.appendChild(a);

  a.click();

  a.remove();
}


/* =========================
   DELETE VIDEO
========================= */

async function deleteVideo(
  id,
  filePath
){

  if(!confirm(
    "এই Video Delete করবেন?"
  )){
    return;
  }


  const storageResult =
    await supabaseClient
      .storage
      .from("videos")
      .remove([
        filePath
      ]);


  if(storageResult.error){

    alert(
      "❌ Video file delete হয়নি: " +
      storageResult.error.message
    );

    return;
  }


  const dbResult =
    await supabaseClient
      .from("videos")
      .delete()
      .eq(
        "id",
        id
      );


  if(dbResult.error){

    alert(
      "❌ Video তথ্য delete হয়নি: " +
      dbResult.error.message
    );

    return;
  }


  await loadVideos();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   ESCAPE JS
========================= */

function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


/* =========================
   START
========================= */

checkSession();

</script></body>
</html>
